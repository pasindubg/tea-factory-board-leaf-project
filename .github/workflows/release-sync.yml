name: Release — sync blm-cloud-release from main

# The only way blm-cloud-release is allowed to move: a fast-forward onto main,
# run by hand. Nothing merges into it, and no branch other than main can reach
# it.
#
# Two things follow from fast-forwarding rather than merging. There is no merge
# commit, so the release branch stops reading as "1 commit ahead of main" —
# the two refs are now either identical or the release is strictly behind, and
# "ahead" becomes a real signal that something was pushed to it directly.
# And because a fast-forward is impossible when the release carries commits of
# its own, divergence is caught here instead of surfacing as a conflict later.
#
# This only governs what this workflow does. The branch is held shut by a
# ruleset on blm-cloud-release with "Restrict updates" enabled, bypassed by
# the Repository admin role.
#
# Which is why the push needs RELEASE_SYNC_TOKEN rather than the built-in
# GITHUB_TOKEN. A ruleset bypass is granted to roles, teams, apps and users;
# GITHUB_TOKEN acts as github-actions[bot], which is none of those and cannot
# be added to the list, so its push is refused. A fine-grained PAT owned by an
# admin — Contents: read and write, this repository only — is attributed to
# that admin instead, and the Repository admin bypass covers it.

on:
  workflow_dispatch:

# Nothing here uses GITHUB_TOKEN to write; the PAT below does the pushing.
permissions:
  contents: read

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  fast-forward:
    name: Fast-forward blm-cloud-release to main
    runs-on: ubuntu-latest

    steps:
      # Checked before anything else, because the failure it prevents is a
      # confusing one: without the token, checkout silently falls back to
      # GITHUB_TOKEN and the job gets all the way to a rejected push.
      - name: Require the release token
        env:
          TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_SYNC_TOKEN is not set."
            echo "Add a fine-grained PAT owned by a repository admin, with"
            echo "Contents: read and write on this repository, as an Actions"
            echo "secret named RELEASE_SYNC_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials leaves this token configured for the push below.
          token: ${{ secrets.RELEASE_SYNC_TOKEN }}

      - name: Fast-forward blm-cloud-release to main
        run: |
          set -e
          git fetch origin main blm-cloud-release

          if git merge-base --is-ancestor origin/main origin/blm-cloud-release; then
            echo "blm-cloud-release already contains main — nothing to release."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/blm-cloud-release origin/main; then
            echo "blm-cloud-release has commits that main does not:"
            git log --oneline origin/main..origin/blm-cloud-release
            echo
            echo "Fast-forwarding would discard them. Get them onto main first."
            exit 1
          fi

          echo "Releasing to production:"
          git log --oneline origin/blm-cloud-release..origin/main

          # Deliberately not --force. git refuses anything that is not a
          # fast-forward, which is the guarantee this whole workflow rests on.
          git push origin origin/main:refs/heads/blm-cloud-release
