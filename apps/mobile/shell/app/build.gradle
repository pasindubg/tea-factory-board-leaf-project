plugins { id 'com.android.application' }

def mobileWebUrl = providers.gradleProperty('MOBILE_WEB_URL').orElse('').get()
def parsedUrl
try { parsedUrl = new URI(mobileWebUrl) } catch (Exception ignored) { throw new GradleException('MOBILE_WEB_URL must be a valid origin.') }
def localDebug = parsedUrl.scheme == 'http' && parsedUrl.host == 'localhost' && parsedUrl.port > 0
if ((!localDebug && parsedUrl.scheme != 'https') || !parsedUrl.host || parsedUrl.rawUserInfo != null
        || parsedUrl.rawQuery != null || parsedUrl.rawFragment != null || !(parsedUrl.rawPath in ['', '/'])
        || parsedUrl.port == 0 || parsedUrl.port > 65535) {
    throw new GradleException('Set -PMOBILE_WEB_URL=https://your-mobile-site.vercel.app, or use http://localhost:8081 for a debug APK.')
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (localDebug) variant.enable = false
    }
}

android {
    namespace 'lk.boardleaf.field'
    compileSdk 35
    defaultConfig {
        applicationId 'lk.boardleaf.field'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('APK_VERSION_CODE').orElse('1').get().toInteger()
        versionName providers.gradleProperty('APK_VERSION_NAME').orElse('0.1.0').get()
        buildConfigField 'String', 'MOBILE_WEB_URL', '"' + mobileWebUrl.replaceAll('/$', '') + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
